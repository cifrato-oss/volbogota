# Build y despliegue de staging, para enseñarle una rama al equipo antes de mergear.
#
# Se separa de `cloudbuild.yaml` en dos cosas, y las dos importan:
#
#   · Etiqueta su propia imagen (`:staging`), así que un build de staging nunca
#     mueve el `:latest` del que depende producción.
#   · Enciende NEXT_PUBLIC_MOSTRAR_MOCK, que es lo único que hace visibles los
#     bancos sembrados por `pnpm run seed:sangre`. Producción no la pone y por eso
#     esos bancos no existen para un donante real.
#
# Comparte el Firestore de producción, porque es el único que hay. Lo que separa
# a staging de producción no es la base de datos: es esa bandera y el tag de
# `esMock` en los documentos.
#
#   gcloud builds submit --config cloudbuild.staging.yaml --project volbogota
#
substitutions:
  _IMAGEN: us-central1-docker.pkg.dev/volbogota/volbogota-run/app
  _SERVICIO: volbogota-staging
  _REGION: us-central1
  _APP_URL: https://volbogota-staging-aqnj5tyndq-uc.a.run.app

steps:
  # Reutilizar las capas del build anterior de staging. Falla en silencio la
  # primera vez, cuando todavía no hay nada que traer.
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ["-c", "docker pull ${_IMAGEN}:staging || exit 0"]

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --cache-from
      - ${_IMAGEN}:staging
      - -t
      - ${_IMAGEN}:staging
      - --build-arg
      - NEXT_PUBLIC_APP_URL=${_APP_URL}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_API_KEY=AIzaSyA7WTKybRS80O6NdSOMSKtTDGVwyz5t7YA
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=volbogota.firebaseapp.com
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=volbogota
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=volbogota.firebasestorage.app
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=761468343345
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_APP_ID=1:761468343345:web:f2b1f908f0e39b9705b110
      - --build-arg
      - NEXT_PUBLIC_DONAR_SELECCION=false
      - --build-arg
      - NEXT_PUBLIC_MOSTRAR_MOCK=true
      - .

  - name: gcr.io/cloud-builders/docker
    args: [push, "${_IMAGEN}:staging"]

  # Desplegar en el mismo paso: staging existe para ser mirado, y separar build de
  # deploy solo agrega un comando que alguien va a olvidar.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICIO}
      - --image=${_IMAGEN}:staging
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --cpu=1
      - --memory=512Mi
      - --min-instances=0
      - --max-instances=4
      - --set-env-vars=FIREBASE_PROJECT_ID=volbogota,DB_DRIVER=firestore,LOG_LEVEL=info
      - --set-secrets=CELULAR_HASH_SALT=CELULAR_HASH_SALT:latest,ADMIN_API_TOKEN=ADMIN_API_TOKEN:latest,SHEETS_HOOK_TOKEN=SHEETS_HOOK_TOKEN:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1200s

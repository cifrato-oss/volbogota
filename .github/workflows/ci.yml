name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job needs the same four setup steps, and repeating them is the price of
# splitting the pipeline. What the split buys is a red mark that names the stage:
# before this, lint and tests shared one check, so a failure meant opening the log
# to find out which of the two it was.
#
# `lint` and `test` run side by side, and `deploy` waits for both. They were
# chained at first so a failing suite could not be blamed on code that does not
# typecheck — worth about forty-five seconds, which measured against a pipeline
# whose deploy step alone takes six minutes was not worth paying on every merge.
# The two checks still report separately, so the stage is still named.

jobs:
  lint:
    name: Formato · Lint · Tipos
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The package manager comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

  test:
    name: Tests · Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      # The build stays with the tests because it is the same question — does this
      # actually run — and because a build that fails after a green test suite is
      # the last thing anyone wants to discover from a rollout.
      - name: Build
        run: pnpm run build

  # The deploy gate.
  #
  # App Hosting can roll out on its own whenever `main` moves, and did until now:
  # the deploy started in parallel with these checks and did not wait for them, so
  # a commit with failing tests reached production while CI was still running.
  #
  # `needs: [lint, test]` is what closes that: nothing reaches production unless
  # both checks are green. The cost is wall-clock — the deploy used to start on
  # push and now waits for the checks — and that is the trade being made on
  # purpose.
  #
  # Requires the backend's own rollout policy to be disabled, otherwise both this
  # job and App Hosting deploy the same commit and the second rollout cancels the
  # first for no reason.
  deploy:
    name: Deploy · App Hosting
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    # Workload Identity Federation: GitHub mints a short-lived OIDC token per run
    # and Google exchanges it for credentials scoped to one service account. No key
    # is stored in this repository, which is public.
    permissions:
      contents: read
      id-token: write
      # Only to ask which pull request a commit came from, for the Slack message.
      pull-requests: read

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          project_id: volbogota
          workload_identity_provider: projects/761468343345/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-deployer@volbogota.iam.gserviceaccount.com

      # `npx --yes` downloads the whole CLI on every run, which is around twenty
      # seconds of a job that is otherwise waiting. The cache key pins the version
      # so a bump fetches once and then stops costing anything.
      - name: Cache firebase-tools
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: firebase-tools-15-${{ runner.os }}

      # The rollout builds from the branch on Google's side, so there is nothing to
      # upload from here — this step only asks for it and waits.
      #
      # It waits on purpose. Firing and forgetting would end this job in seconds,
      # and a rollout that then failed would leave the run green and the site
      # broken, with nobody looking. The five minutes are Google's build; what this
      # step buys for them is that a broken deploy is red here.
      #
      # The commit goes through the environment rather than into the command line.
      # `github.sha` is a hex digest and safe either way, but a `run:` that
      # interpolates event data directly is the habit that later gets copied onto a
      # field an attacker controls.
      # `continue-on-error` so the Slack step runs on a failure too, and the output
      # is kept so that message can carry the actual error. The job is failed again
      # at the end — a red deploy has to stay red here as well, not only in Slack.
      - name: Roll out main
        id: rollout
        continue-on-error: true
        env:
          SHA: ${{ github.sha }}
        run: |
          set -o pipefail
          npx --yes firebase-tools@15 apphosting:rollouts:create volbogota \
            --git-commit "$SHA" --force --project volbogota 2>&1 | tee /tmp/rollout.log

      # Slack is meant to be enough on its own: whoever reads it should not have to
      # open GitHub or the Google console to know what happened. So the message
      # carries the commit, who pushed it, and on a failure the tail of the actual
      # error — the run link is there for the rest, not for the basics.
      #
      # Every value goes through the environment and into `jq --arg`. A commit
      # message is attacker-controlled text: interpolated into a shell command it is
      # a command, and pasted into JSON it breaks the payload with one quote.
      #
      # A missing webhook logs and moves on. This should not be the reason a deploy
      # is reported as broken.
      - name: Avisar a Slack
        if: always()
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          RESULTADO: ${{ steps.rollout.outcome }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          MENSAJE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "Falta el secreto SLACK_WEBHOOK_URL. No se envía nada."
            exit 0
          fi

          TITULO=$(head -1 <<< "$MENSAJE")

          # Which pull request this commit came from. Asked of the API rather than
          # parsed out of "Merge pull request #28 from …", so it also works if the
          # repo ever switches to squash merges, where that line does not exist.
          #
          # A direct push to main has no pull request, and neither does a failing
          # API call. Both end with an empty link and a message that still makes
          # sense — this is the nice-to-have, not the point.
          PR=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls" \
                 --jq '.[0] | "<\(.html_url)|#\(.number) \(.title)>"' 2>/dev/null || true)
          [ "$PR" = "null" ] && PR=""
          [ -n "$PR" ] && PR=$(printf '\n%s' "$PR")

          if [ "$RESULTADO" = "success" ]; then
            TEXTO=$(printf '✅ *Deploy en producción*\n<https://centrosdeacopiobogota.org|centrosdeacopiobogota.org> · `%s` · %s\n> %s%s' \
              "${SHA:0:7}" "$ACTOR" "$TITULO" "$PR")
          else
            ERROR=$(tail -n 12 /tmp/rollout.log 2>/dev/null | grep -v '^npm warn' | tail -n 6)
            TEXTO=$(printf '❌ *Deploy fallido — producción sigue en la versión anterior*\n`%s` · %s\n> %s%s\n\n```\n%s\n```\n<%s|Ver la corrida>' \
              "${SHA:0:7}" "$ACTOR" "$TITULO" "$PR" "${ERROR:-sin salida}" "$RUN_URL")
          fi

          jq -n --arg t "$TEXTO" '{text: $t, mrkdwn: true}' \
            | curl -sS -X POST -H 'Content-Type: application/json' --data @- "$WEBHOOK"

      - name: Fallar si el rollout falló
        if: steps.rollout.outcome != 'success'
        run: |
          echo "El rollout no terminó bien. Detalle arriba, en 'Roll out main'."
          exit 1

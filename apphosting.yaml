# Configuración del backend de Firebase App Hosting.
#
# El backend `volbogota` despliega este repo desde `main` en cada push. Sin este
# archivo arranca sin ninguna variable, y `src/server/config/env.ts` exige tres
# en producción: la app sirve la home pero todo `/api/*` responde 500.
#
# Las variables se declaran primero en `src/server/config/env.ts` y se documentan
# en `.env.example`; acá van los valores del deploy.

runConfig:
  # Los valores por defecto de App Hosting, explícitos para que se vean.
  cpu: 1
  memoryMiB: 512
  concurrency: 80
  # `minInstances: 0` significa arranque en frío en la primera visita después de
  # un rato sin tráfico. Para el día del evento vale subirlo a 1 y bajarlo
  # después: una instancia encendida se cobra por hora, haya o no visitas.
  minInstances: 0
  maxInstances: 10

env:
  # --- Firestore --------------------------------------------------------
  # No van FIREBASE_CLIENT_EMAIL ni FIREBASE_PRIVATE_KEY: acá no hace falta
  # ninguna llave. App Hosting adjunta la cuenta de servicio
  # `firebase-app-hosting-compute@volbogota.iam.gserviceaccount.com` al servicio
  # y `db/drivers/firestore.driver.ts` cae solo al camino de ADC. Esa cuenta ya
  # trae permisos de Firestore por `roles/firebase.sdkAdminServiceAgent`, así que
  # no hay nada que conceder ni un secreto rotando por ahí.
  - variable: FIREBASE_PROJECT_ID
    value: volbogota
    availability:
      - RUNTIME

  - variable: DB_DRIVER
    value: firestore
    availability:
      - RUNTIME

  - variable: LOG_LEVEL
    value: info
    availability:
      - RUNTIME

  # --- URL pública ------------------------------------------------------
  # Next.js incrusta las `NEXT_PUBLIC_*` en el bundle durante `next build`, así
  # que esta tiene que estar disponible en BUILD y no solo en RUNTIME: cambiarla
  # después no afecta al JavaScript ya compilado, hay que volver a construir.
  #
  # El dominio oficial. `volbogota.org` sigue registrado en el backend y sirviendo
  # lo mismo, así que funciona como alias.
  #
  # Cambiar esto exige un despliegue nuevo, no solo editar el valor: Next.js
  # incrusta las `NEXT_PUBLIC_*` en el bundle durante `next build`.
  #
  # Que además la app responda por cualquiera de los dos dominios no depende de
  # esta variable: los clientes de `src/lib` solo la consultan cuando `window` es
  # undefined, y todo el consumo de `src/queries` sale de componentes cliente, que
  # resuelven la base con `window.location.origin`.
  - variable: NEXT_PUBLIC_APP_URL
    value: https://centrosdeacopiobogota.org
    availability:
      - BUILD
      - RUNTIME

  # --- Config pública del SDK web de Firebase ---------------------------
  # El navegador usa estas para abrir Firestore y leer en vivo con onSnapshot
  # (centros, turnos, necesidades). Son `NEXT_PUBLIC_*`, así que TIENEN que estar
  # en BUILD para quedar incrustadas en el bundle: sin ellas `getFirebaseDb()`
  # devuelve null en el cliente y las vistas en tiempo real caen a estado de
  # error. Son públicas por diseño (viajan al cliente); la seguridad la imponen
  # las reglas de Firestore (`firestore.rules`), no ocultar estos valores.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyA7WTKybRS80O6NdSOMSKtTDGVwyz5t7YA
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: volbogota.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: volbogota
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: volbogota.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "761468343345"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:761468343345:web:f2b1f908f0e39b9705b110"
    availability:
      - BUILD
      - RUNTIME

  # --- Flags de features (cliente) --------------------------------------
  # Selección interactiva de donaciones (+ canasta de confirmación) en /donar.
  # `false` = solo informativo. Es `NEXT_PUBLIC_*`, así que va en BUILD: para
  # cambiarla hay que volver a desplegar, no solo reiniciar.
  - variable: NEXT_PUBLIC_DONAR_SELECCION
    value: "false"
    availability:
      - BUILD
      - RUNTIME

  # --- Secretos ---------------------------------------------------------
  # Viven en Cloud Secret Manager; acá va el nombre, nunca el valor. Se crean con
  #   firebase apphosting:secrets:set <NOMBRE> --project volbogota
  #
  # OJO con CELULAR_HASH_SALT: entra en el digest que deduplica inscripciones por
  # turno. Cambiarla cuando ya existan inscripciones reales invalida todos los
  # digests guardados y rompe la deduplicación en silencio. Se define una vez.
  - variable: CELULAR_HASH_SALT
    secret: CELULAR_HASH_SALT
    availability:
      - RUNTIME

  - variable: ADMIN_API_TOKEN
    secret: ADMIN_API_TOKEN
    availability:
      - RUNTIME

  # --- Sincronización con la hoja maestra -------------------------------
  # El token es el mismo que valida el Apps Script en el cuerpo de la petición:
  # los dos extremos de la misma sincronización responden al mismo secreto, así
  # que este valor no se genera, se copia del script.
  - variable: SHEETS_HOOK_TOKEN
    secret: SHEETS_HOOK_TOKEN
    availability:
      - RUNTIME

  # El despliegue "Web app" del script, para el sentido contrario: por acá el
  # backend empuja las reservas hacia la hoja. La URL no es un secreto — quien
  # autoriza es SHEETS_HOOK_TOKEN, que el script valida en el cuerpo.
  - variable: SHEETS_WEBHOOK_URL
    value: https://script.google.com/macros/s/AKfycbw5prSWqr51TbBD48It72IL_IiFJNEFNbeM5CJyqWE30pKmydGOmlVRhUXnU3B4C6BV2Q/exec
    availability:
      - RUNTIME

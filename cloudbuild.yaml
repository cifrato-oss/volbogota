# Build de la imagen para Cloud Run.
#
# Las `NEXT_PUBLIC_*` van como build args porque Next las incrusta al compilar.
# Son públicas por diseño — viajan en el bundle de cualquier visitante — así que
# estar acá no las expone más de lo que ya están. Los secretos NO están: entran en
# runtime desde Secret Manager.
substitutions:
  _IMAGEN: us-central1-docker.pkg.dev/volbogota/volbogota-run/app
  _APP_URL: https://centrosdeacopiobogota.org

steps:
  # Traer la imagen anterior para poder reutilizar sus capas. Sin esto cada build
  # empieza de cero y no le gana a App Hosting — el caché ES la ventaja de construir
  # nosotros. Falla en silencio la primera vez, cuando todavía no hay nada que traer.
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ["-c", "docker pull ${_IMAGEN}:latest || exit 0"]

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --cache-from
      - ${_IMAGEN}:latest
      - -t
      - ${_IMAGEN}:${SHORT_SHA}
      - -t
      - ${_IMAGEN}:latest
      - --build-arg
      - NEXT_PUBLIC_APP_URL=${_APP_URL}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_API_KEY=AIzaSyA7WTKybRS80O6NdSOMSKtTDGVwyz5t7YA
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=volbogota.firebaseapp.com
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=volbogota
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=volbogota.firebasestorage.app
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=761468343345
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_APP_ID=1:761468343345:web:f2b1f908f0e39b9705b110
      - --build-arg
      - NEXT_PUBLIC_DONAR_SELECCION=false
      - .

images:
  - ${_IMAGEN}:${SHORT_SHA}
  - ${_IMAGEN}:latest

options:
  logging: CLOUD_LOGGING_ONLY
  # `next build` es CPU-bound y Turbopack paraleliza. La máquina por defecto de
  # Cloud Build es e2 con 2 vCPU; ocho es la palanca que App Hosting no expone.
  machineType: E2_HIGHCPU_8
